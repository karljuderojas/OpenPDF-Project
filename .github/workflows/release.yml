name: Release

# Start it from the Actions tab ("Run workflow") and type a version such as 1.0.0.
# It builds the app, tags the commit and publishes a GitHub Release with the APK attached.
# It also builds (without publishing) when this file or the app's build file changes in a pull request.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number, for example 1.0.0
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - app/build.gradle.kts
      - app/proguard-rules.pro

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # create the tag and the Release
    env:
      VERSION: ${{ inputs.version || '0.0.0-test' }}
      HAS_KEY: ${{ secrets.FREEPDF_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore the release key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.FREEPDF_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FREEPDF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FREEPDF_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FREEPDF_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "FREEPDF_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "FREEPDF_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FREEPDF_KEY_ALIAS=$KEY_ALIAS"
            echo "FREEPDF_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build the release APK
        run: ./gradlew assembleRelease -PappVersionName="$VERSION" -PappVersionCode="${{ github.run_number }}"
      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/FreePDF-$VERSION.apk"
          (cd dist && sha256sum "FreePDF-$VERSION.apk" > "FreePDF-$VERSION.apk.sha256")
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: freepdf-release-apk-test
          path: dist/*
      - name: Publish the Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            note="Signed with the FreePDF release key."
          else
            note="This build is signed with a test key, not the project's own release key. Android will not install one test-key version over another, so uninstall the old version first (this clears the app's saved data; export anything you need first). A release signed with the real key will also need the old one uninstalled once."
          fi
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "FreePDF $VERSION" \
            --notes "Download **FreePDF-$VERSION.apk** below and open it on your phone. See the [install steps](https://github.com/${{ github.repository }}#install-on-your-phone). $note"
