name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      # PRs still compile the app, but only main keeps an installable debug APK.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: freepdf-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # Renders every screen (see ScreenshotTest) and posts the images on the pull request.
  screenshots:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write        # push images to the "screenshots" branch
      pull-requests: write   # post the review comment
    concurrency:
      group: screenshots-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Render screenshots
        run: ./gradlew recordRoborazziDebug
      # PageEditorTest stamps text, a checkmark and a signature onto a rotated page. PDFium cannot
      # render under Robolectric, so poppler renders that PDF to go with the screenshots.
      - name: Render the stamped rotated page
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null
          pdftoppm -png -f 1 -l 1 -scale-to 1080 -singlefile \
            app/build/outputs/qa/stamps-on-rotated-page.pdf app/build/outputs/roborazzi/pdf_stamps_on_rotated_page
          # PageEditorTest also adds Edit mode's text, a photo and a transparent logo to a page.
          pdftoppm -png -f 1 -l 1 -scale-to 1080 -singlefile \
            app/build/outputs/qa/edit-text-and-image.pdf app/build/outputs/roborazzi/pdf_edit_text_and_image
          # StampsTest writes a page with a text box and stamps as they come out in the PDF itself.
          if [ -f app/build/outputs/qa/textbox-and-stamps.pdf ]; then
            pdftoppm -png -f 1 -l 1 -scale-to 1080 -singlefile \
              app/build/outputs/qa/textbox-and-stamps.pdf app/build/outputs/roborazzi/pdf_textbox_and_stamps
          fi
      # MarksTest draws a rectangle, an ellipse, a line and an arrow with PdfBox's own appearance
      # streams. Show them as another reader draws them.
      - name: Render the shapes
        run: |
          if [ -f app/build/outputs/qa/shapes.pdf ]; then
            pdftoppm -png -f 1 -l 1 -scale-to 1080 -singlefile \
              app/build/outputs/qa/shapes.pdf app/build/outputs/roborazzi/pdf_shapes
          fi
      - name: Render the watermarked page
        run: |
          if [ -f app/build/outputs/qa/watermarks.pdf ]; then
            pdftoppm -png -f 1 -l 1 -scale-to 1080 -singlefile \
              app/build/outputs/qa/watermarks.pdf app/build/outputs/roborazzi/pdf_watermarked_page
          fi
      # FlattenerTest flattens a highlight, a drawing, a note and a box into the sample's first page.
      - name: Render the locked copy
        run: |
          pdftoppm -png -f 1 -l 1 -scale-to 1080 -singlefile \
            app/build/outputs/qa/locked-copy.pdf app/build/outputs/roborazzi/pdf_locked_copy_page
      # FormFillerTest fills in the sample sign-up form. Show it as another PDF reader draws it.
      - name: Render the filled form
        run: |
          pdftoppm -png -f 1 -l 1 -scale-to-x 1080 -scale-to-y -1 -singlefile \
            app/build/outputs/qa/filled-form.pdf app/build/outputs/roborazzi/pdf_filled_form
      # RedactorTest redacts a patient record. Show it, and have poppler's own text extraction confirm
      # that nothing is left under the black boxes.
      - name: Render the redacted example
        run: |
          pdf=app/build/outputs/qa/redacted-example.pdf
          pdftoppm -png -f 1 -l 1 -scale-to 1080 -singlefile "$pdf" app/build/outputs/roborazzi/pdf_redacted_example
          if pdftotext "$pdf" - | grep -q -e 6789 -e 04/12 -e 9876; then echo "Redacted text can still be extracted"; exit 1; fi
      # SignedCopyTest writes a signed copy of the sample agreement. Show its signing certificate
      # page, and have poppler check the digital signature independently of our own code.
      - name: Render the signing certificate page
        run: |
          pdf=app/build/outputs/signed/agreement-signed.pdf
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          pdftoppm -png -f "$pages" -l "$pages" -scale-to-x 1080 -scale-to-y -1 -singlefile \
            "$pdf" app/build/outputs/roborazzi/signed_copy_certificate_page
          pdfsig "$pdf" > app/build/outputs/signed/pdfsig.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-test-report
          path: app/build/reports/tests/
      - name: Publish screenshots to the screenshots branch
        id: publish
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin screenshots > /dev/null; then
            git fetch --depth 1 origin screenshots
            git worktree add ../shots FETCH_HEAD
            git -C ../shots checkout -B screenshots
          else
            git worktree add --orphan -b screenshots ../shots
          fi
          cd ../shots
          # Other PRs push to this branch at the same time. On a rejected push, start again from the
          # branch tip and redo only this PR's folder; rebasing shallow history replays a grafted
          # commit that touches every pr-N folder and conflicts.
          for i in 1 2 3 4 5; do
            rm -rf "pr-$PR" && mkdir -p "pr-$PR"
            cp "$GITHUB_WORKSPACE"/app/build/outputs/roborazzi/*.png "pr-$PR/"
            git add -A
            git commit -q -m "Screenshots for PR #$PR at ${HEAD_SHA::7}" || true
            git push origin screenshots && pushed=1 && break
            sleep $((i * 2))
            git fetch --depth 1 origin screenshots && git reset -q --hard FETCH_HEAD
          done
          [ -n "$pushed" ] || { echo "Could not push screenshots after 5 tries"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Post screenshots on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHOTS_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          marker="<!-- screenshots -->"
          {
            echo "$marker"
            echo "### Screenshots"
            echo "Rendered from ${HEAD_SHA::7} on a Pixel 7-sized screen."
            echo
            for f in app/build/outputs/roborazzi/*.png; do
              name=$(basename "$f" .png)
              echo "**${name//_/ }**"
              echo
              echo "<img src=\"https://github.com/$GITHUB_REPOSITORY/blob/$SHOTS_SHA/pr-$PR/$name.png?raw=true\" width=\"270\">"
              echo
            done
            if [ -f app/build/outputs/signed/pdfsig.txt ]; then
              echo "<details><summary>pdfsig on the signed sample</summary>"
              echo
              echo '```'
              cat app/build/outputs/signed/pdfsig.txt
              echo '```'
              echo "</details>"
            fi
          } > body.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh pr comment "$PR" --body-file body.md
          fi
